# Kehribar Gece — Hyprlock

# BACKGROUND
background {
    monitor =
    path = /home/ozbay/Resimler/lavender.jpg
    blur_passes = 3
    contrast = 0.90
    brightness = 0.56
    vibrancy = 0.08
    vibrancy_darkness = 0.15
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 58
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(245, 166, 35, 0.92)
    inner_color = rgba(26, 36, 56, 0.90)
    font_color = rgba(250, 243, 232, 1.0)
    fade_on_empty = false
    font_family = Atkinson Hyperlegible
    placeholder_text = <i><span foreground="##AEB7C6">Parola...</span></i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(250, 243, 232, 1.0)
    font_size = 112
    font_family = Literata SemiBold
    position = 0, -300
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text = Merhaba, $USER
    color = rgba(174, 183, 198, 1.0)
    font_size = 24
    font_family = Atkinson Hyperlegible
    position = 0, -40
    halign = center
    valign = center
}

# CURRENT SONG / SECONDARY INFO
label {
    monitor =
    color = rgba(167, 139, 250, 1.0)
    font_size = 17
    font_family = IBM Plex Mono
    position = 0, -50
    halign = center
    valign = bottom
}
