# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#down
# Required packages
# wofi, waybar, hyprpaper, copyq, kitty, dolphin

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1,3440x1440@99.98,0x0,1,bitdepth,10
monitor=HDMI-A-1,disable,1024x600@59.85Hz,3440x0,0.8,transform,3
workspace = 1, default:true
#monitor=,preferred,auto,auto,bitdepth,8


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar --config /home/ozbay/.config/hypr/waybar.json -s /home/ozbay/.config/hypr/style.css
exec-once = hyprpaper
exec-once = flameshot
exec-once = copyq --start-server
#exec-once = ./home/ozbay/.config/hypr/xdg.bashs

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you uses
$terminal = kitty
$fileManager = dolphin
#$menu = wofi --show=drun --style=/home/ozbay/.config/hypr/wofi-theme.css --location=top
$menu = hyprlauncher
$clipboard = copyq show




# Some default env vars.
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland

#Fuck you nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share:$XDG_DATA_DIRS

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = tr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.""
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 3
    border_size = 3
    col.active_border = rgb(292AEB) rgb(4B4B96) rgb(EB6A28)
    col.inactive_border = rgb(9494EB) rgb(7D7D96) rgb(EBB194)
    layout = master
    locale = tr_TR

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 8
    inactive_opacity = 0.9
    active_opacity = 1
    blur {
        enabled = true
        size = 1
        passes = 0
        vibrancy = 0.52
        vibrancy_darkness = 0.5
    }
    shadow{
      range = 25
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuart, 0.25, 1, 0.5, 1
    bezier = easeInOutQuart, 0.76, 0, 0.24, 1
    bezier = easeInOutBack, 0.68, -0.6, 0.32, 1.6
    bezier = easeInOutCircle, 0.85, 0, 0.15, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeInExpo, 0.7, 0, 0.84, 0
    bezier = linear, 0, 0, 0, 0
    bezier = swift, 0.55, 0, 0.1, 1

    animation = windows, 1, 4, easeOutExpo, popin 90%
    animation = windowsIn, 1, 4, easeInExpo, popin 90%
    animation = windowsOut, 1, 4, easeOutExpo, popin 90%
    animation = windowsMove, 1, 2, easeInOutCircle, popin 90%
    animation = border, 1, 10, linear
    animation = borderangle, 1, 25, linear, loop
    animation = workspaces, 1, 3, swift, slidefade 80%
    animation = specialWorkspace, 1, 3, easeInOutBack, slidefade 80%
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    orientation = left
    allow_small_split = true
    mfact = 0.7
    new_on_top = true
    slave_count_for_center_master = 2
    new_status = slave
    special_scale_factor = 0.5
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe_forever = false
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more 
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, V, exec, $clipboard
bind = $mainMod, P, pseudo,

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, TAB, togglespecialworkspace, magic
bind = $mainMod, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod CTRL, RIGHT, workspace, e+1
bind = $mainMod CTRL, LEFT, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, Return, layoutmsg, swapwithmaster

# Multimedia keys
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindle=, XF86Search, exec, launchpad
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=, XF86AudioPlay, exec, playerctl play-pause # the stupid key is called play , but it toggles 
bindl=, XF86AudioNext, exec, playerctl next 
bindl=, XF86AudioPrev, exec, playerctl previous
bind=, Print, exec, flameshot gui

# Window rules

windowrule {
  name = PicinPic
  float = on
  match: = ^(Picture-in-picture)$
}

windowrule {
  name = kitty
  float = on
  pin = on
  size = 1280 750
  match:class = ^(kitty)$
  match:title = ^(kitty)$
}

windowrule {
  name = windowrule-5
  float = on
  match:class = ^(PacketTracer)$
  match:title = .*[0-9]
}


windowrule {
  name = windowrule-7
  float = on
  size = 500 750
  move = 
  match:class = ^(com.github.hluk.copyq)$
}

windowrule {
  name = windowrule-8
  float = on
  match:class = ^(Vncviewer)$
}

windowrule {
  name = windowrule-9
  float = on
  match:class = ^(org.wireshark.Wireshark)$
}



# XWayland

windowrule {
  name = windowrule-10
  opacity = 0.0 override
  no_anim = on
  no_initial_focus = on
  max_size = 1 1
  no_blur = on
  no_focus = on
  match:class = ^(xwaylandvideobridge)$
}


